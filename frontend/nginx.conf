limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
    listen 80;
    # A reverse proxy on this host reaches us through the Docker gateway; take the
    # visitor's address from X-Forwarded-For only from there.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Meal and progress photos are uploaded through us (the backend allows 15 MB).
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    # Opened as a Telegram Mini App: Telegram Web shows it in a frame from web.telegram.org.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header Referrer-Policy same-origin always;
    # Rate-limited Bastion sign-in answers in the same JSON shape as the backend.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Слишком много попыток входа. Подождите минуту и попробуйте снова.","code":"rate_limited"}';
    }
    location = /api/auth/bastion {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # index.html must be revalidated so a new build is picked up at once;
    # hashed assets never change and can be cached for good.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Referrer-Policy same-origin always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
