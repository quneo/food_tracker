[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "food-tracker-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram[proxy]>=3.18,<4", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
